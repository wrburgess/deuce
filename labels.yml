# deuce's label set — and the starting copy an adopting repository receives.
#
# Class: seed. A host takes this file once and owns it from that moment; deuce never overwrites it
# again — https://github.com/wrburgess/deuce/blob/main/sds/05-distribution.md, What ships.
#
# WHAT IS YOURS TO CHANGE, and what is not, is Chapter 0 — Work Tracking System:
# https://github.com/wrburgess/deuce/blob/main/sds/00-identity-and-governance.md
# Glossed only as far as the edit you are about to make needs: the three axes and their prefixes
# are fixed there; the type: VALUES are yours to extend, and type:feature sits beside type:task,
# where a bare `feature` is a different label the issue forms deuce ships will not find; the area:
# block below is deuce's own chapters, for you to replace.
#
# CREATE THESE ON THE TRACKER BEFORE THE FIRST TEMPLATED ISSUE. The forms deuce ships name these
# labels by name, and GitHub drops a label the repository does not have — silently, with the issue
# opening fine. Creating them is one pass of one command, once per entry below:
#
#   gh label create "type:task" --color 0E8A16 --description "One branch, one PR of feature/improvement work"
#
# Nothing generates them from this file, and on a host nothing reads it at all: it is hand-synced,
# and the tracker lint that reads it in deuce is not among the files deuce ships. It is
# documentation of the tracker, never a source the tracker is built from. Why it is spelled out:
# measured on wrburgess/deuce#123, 2026-08-17, two hosts carried deuce's forms and none of the ten
# names those forms assign, so every issue opened from a form arrived with no labels at all and
# nothing reported it.
#
# Discipline: every issue carries exactly one label per axis.
axes:
  type:
    - {name: "type:epic",  color: "5319E7", description: "Umbrella with children; eight-field brief; closes when last child merges"}
    - {name: "type:task",  color: "0E8A16", description: "One branch, one PR of feature/improvement work"}
    - {name: "type:bug",   color: "D93F0B", description: "Defect with a reproduction; fix ships with the test that failed first"}
    - {name: "type:spike", color: "1D76DB", description: "Research feeding a decision; terminal artifact is a readout"}
    - {name: "type:chore", color: "FBCA04", description: "Mechanical maintenance; minimal ceremony"}
  status:
    - {name: "status:ready",              color: "C2E0C6", description: "Unblocked; may be picked up"}
    - {name: "status:in-progress",        color: "FEF2C0", description: "Actively being worked"}
    - {name: "status:blocked",            color: "E99695", description: "Waiting on something named in the issue"}
    - {name: "status:review",             color: "BFDADC", description: "PR open; in review"}
    - {name: "status:done-pending-merge", color: "BFD4F2", description: "Work complete; awaiting merge/close"}
  area:
    - {name: "area:identity",     color: "006B75", description: "Ch 0 — identity & governance"}
    - {name: "area:lifecycle",    color: "0052CC", description: "Ch 1 — lifecycle & skills"}
    - {name: "area:review",       color: "8250DF", description: "Ch 2 — Review System + Findings System"}
    - {name: "area:tooling",      color: "76428A", description: "Ch 3 — quality gate & TypeScript tooling"}
    - {name: "area:learning",     color: "2E7D32", description: "Ch 4 — Learning System"}
    - {name: "area:distribution", color: "B60205", description: "Ch 5 — distribution & fleet cutover"}
    - {name: "area:factory",      color: "555555", description: "Ch 6 — factory automation"}
